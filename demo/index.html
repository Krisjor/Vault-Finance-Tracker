<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Finance Tracker · Live Demo</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind via CDN (dev-mode JIT) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Instrument Serif"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            cream: { 50: '#FBF9F4', 100: '#F5F1E8', 200: '#EDE6D3' },
            ink: {
              50:  '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0',
              300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b',
              600: '#475569', 700: '#334155', 800: '#1e293b',
              900: '#0f172a', 950: '#020617',
            },
            ember: { 400: '#F59E0B', 500: '#D97706', 600: '#B45309' },
          },
        },
      },
    }
  </script>

  <style>
    body {
      font-feature-settings: 'cv02','cv03','cv04','cv11';
      background: #FBF9F4;
    }
    .display-serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .tabular { font-variant-numeric: tabular-nums; }
    ::selection { background: rgba(245, 158, 11, 0.35); }

    /* Card style */
    .card { background: #fff; border: 1px solid #EDE6D3; border-radius: 16px; padding: 24px; }
    .card-tight { background: #fff; border: 1px solid #EDE6D3; border-radius: 14px; padding: 16px; }
    .ring-amber:focus { outline: none; box-shadow: 0 0 0 3px rgba(245,158,11,0.35); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 10px; font-weight: 500; font-size: 14px; transition: all 0.15s; cursor: pointer; border: none; }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-primary:hover { background: #1e293b; }
    .btn-secondary { background: #fff; color: #0f172a; border: 1px solid #EDE6D3; }
    .btn-secondary:hover { background: #FBF9F4; }
    .btn-ghost { background: transparent; color: #475569; }
    .btn-ghost:hover { background: #F5F1E8; color: #0f172a; }
    .btn-amber { background: #F59E0B; color: #1e293b; font-weight: 600; }
    .btn-amber:hover { background: #D97706; color: #fff; }
    .btn-danger { background: #DC2626; color: #fff; }
    .btn-danger:hover { background: #B91C1C; }

    /* Inputs */
    .input, .select, .textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #EDE6D3; background: #fff; color: #0f172a;
      font-size: 14px; transition: box-shadow 0.15s, border-color 0.15s;
    }
    .input:focus, .select:focus, .textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(15,23,42,0.08); border-color: #0f172a; }
    .label { display: block; font-size: 13px; font-weight: 500; color: #334155; margin-bottom: 6px; }

    /* Sidebar nav links */
    .navlink { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; color: #475569; font-weight: 500; font-size: 14px; transition: all 0.12s; cursor: pointer; }
    .navlink:hover { background: #F5F1E8; color: #0f172a; }
    .navlink.active { background: #0f172a; color: #FBF9F4; }
    .navlink.active svg { color: #F59E0B; }

    /* Misc */
    .stat-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; }
    .stat-value { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: #0f172a; line-height: 1.1; font-variant-numeric: tabular-nums; }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 16px; background: #0f172a; color: #fff; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 100; animation: slideUpFade 0.25s ease-out; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .toast-success { background: #047857; }
    .toast-error { background: #DC2626; }
    @keyframes slideUpFade { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 50; display: grid; place-items: center; animation: fadeIn 0.18s ease-out; padding: 16px; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,0.25); animation: pop 0.22s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* Progress bar */
    .progress-track { background: #F5F1E8; border-radius: 999px; overflow: hidden; height: 8px; }
    .progress-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease-out; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; background-clip: padding-box; }

    /* Subtle "demo badge" */
    .demo-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      background: rgba(245, 158, 11, 0.15); color: #B45309; border-radius: 999px;
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .dot { width: 6px; height: 6px; background: #F59E0B; border-radius: 999px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>

<body class="font-sans text-ink-900">
  <div id="root"></div>

  <!-- Load via ESM from esm.sh — works from file:// with no CORS issues -->
  <!-- Babel standalone via jsDelivr (sets CORS: * on all responses) -->
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>
  <script type="module">
    document.getElementById('root').innerHTML =
      '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Inter,sans-serif;color:#64748b;gap:16px">' +
      '<div style="width:32px;height:32px;border:3px solid #EDE6D3;border-top-color:#0f172a;border-radius:50%;animation:spin 0.8s linear infinite"></div>' +
      '<style>@keyframes spin{to{transform:rotate(360deg)}}</style>' +
      '<span style="font-size:14px">Loading Finance Tracker…</span>' +
      '</div>';

    function showError(msg) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:monospace;font-size:13px;color:#DC2626;background:#FFF5F5;border:1px solid #FCA5A5;border-radius:8px;margin:40px;line-height:1.8">' +
        '<strong style="font-size:15px">Could not load app</strong><br><br>' + msg +
        '<br><br><span style="color:#475569">Open browser console (F12) for more detail.</span></div>';
    }

    try {
      const [React, ReactDOMPkg, RechartsM] = await Promise.all([
        import('https://esm.sh/react@18'),
        import('https://esm.sh/react-dom@18/client'),
        import('https://esm.sh/recharts@2.12.7'),
      ]);

      // Expose as globals so the JSX app code can reference them
      // esm.sh named exports are directly on the module object
      window.React    = React.default ? React.default : React;
      // Merge named exports onto React global (useState etc.) 
      Object.assign(window.React, React);
      window.ReactDOM = ReactDOMPkg;
      window.Recharts = RechartsM;

      // Babel is already loaded as a UMD global via the <script> tag above
      const appScript = document.getElementById('app-source').textContent;
      const compiled  = Babel.transform(appScript, { presets: ['react'] }).code;
      // eslint-disable-next-line no-new-func
      new Function(compiled)();
    } catch(e) {
      console.error(e);
      showError(e.message);
    }
  </script>

  <script id="app-source" type="text/jsx">
    const { useState, useEffect, useMemo, useReducer, useRef, createContext, useContext } = React;
    const {
      LineChart, Line, BarChart, Bar, PieChart, Pie, Cell,
      AreaChart, Area, ResponsiveContainer, XAxis, YAxis,
      CartesianGrid, Tooltip, Legend,
    } = Recharts;

    // ====================================================================
    // STORAGE LAYER
    // --------------------------------------------------------------------
    // State persists in localStorage so a page refresh keeps the current
    // data. "Clear data" restores the seeded fixtures — the baseline state
    // every demo session starts from.
    // ====================================================================

    const STORAGE_KEY = 'finance_tracker_demo_v1';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* corrupt → reseed */ }
      return seed();
    }

    function saveState(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function uid() { return Math.random().toString(36).slice(2, 10); }

    // ====================================================================
    // SEED DATA
    // --------------------------------------------------------------------
    // 90 days of realistic Albanian-context transactions: a salary on the 1st,
    // groceries, restaurant visits, transport, utilities, etc.  This gives the
    // dashboard, reports, and budget views something interesting to render.
    // ====================================================================

    function seed() {
      const today = new Date();
      const dStr = (d) => d.toISOString().slice(0, 10);
      const daysAgo = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return d; };
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

      const accounts = [
        { id: 'a_chk', name: 'BKT Checking', type: 'checking', currency: 'ALL',
          initialBalance: 85000, color: '#3B82F6' },
        { id: 'a_sav', name: 'Raiffeisen Savings', type: 'savings', currency: 'ALL',
          initialBalance: 240000, color: '#10B981' },
        { id: 'a_cash', name: 'Cash Wallet', type: 'cash', currency: 'ALL',
          initialBalance: 12000, color: '#F59E0B' },
        { id: 'a_eur', name: 'Revolut (EUR)', type: 'checking', currency: 'EUR',
          initialBalance: 450, color: '#8B5CF6' },
      ];

      const categories = [
        { id: 'c_hous',  name: 'Housing',       type: 'expense', color: '#EF4444' },
        { id: 'c_groc',  name: 'Groceries',     type: 'expense', color: '#F59E0B' },
        { id: 'c_rest',  name: 'Restaurants',   type: 'expense', color: '#F97316' },
        { id: 'c_tran',  name: 'Transport',     type: 'expense', color: '#3B82F6' },
        { id: 'c_util',  name: 'Utilities',     type: 'expense', color: '#0EA5E9' },
        { id: 'c_heal',  name: 'Health',        type: 'expense', color: '#EC4899' },
        { id: 'c_ent',   name: 'Entertainment', type: 'expense', color: '#A855F7' },
        { id: 'c_shop',  name: 'Shopping',      type: 'expense', color: '#8B5CF6' },
        { id: 'c_edu',   name: 'Education',     type: 'expense', color: '#14B8A6' },
        { id: 'c_sub',   name: 'Subscriptions', type: 'expense', color: '#6366F1' },
        { id: 'c_trav',  name: 'Travel',        type: 'expense', color: '#06B6D4' },
        { id: 'c_other', name: 'Other',         type: 'expense', color: '#6B7280' },
        { id: 'c_sal',   name: 'Salary',        type: 'income',  color: '#10B981' },
        { id: 'c_free',  name: 'Freelance',     type: 'income',  color: '#22C55E' },
        { id: 'c_gift',  name: 'Gifts',         type: 'income',  color: '#A3E635' },
        { id: 'c_inv',   name: 'Investments',   type: 'income',  color: '#84CC16' },
      ];

      // Realistic transaction patterns
      const txns = [];
      const merchantsByCategory = {
        c_groc: ['Conad', 'Spar Supermarket', 'Big Market', 'Carrefour'],
        c_rest: ['Era Restaurant', 'Mullixhiu', 'Sky Tower Café', 'Pista', 'Burger King', 'Mon Cheri'],
        c_tran: ['Tirana Taxi', 'Bus pass', 'Fuel - Kastrati', 'Bolt ride'],
        c_util: ['OSHEE electricity', 'UKT water', 'Vodafone internet', 'ALBtelecom mobile'],
        c_heal: ['Pharmacy purchase', 'Doctor visit', 'Lab tests'],
        c_ent:  ['Cinema Plaza', 'Concert tickets', 'Spotify', 'Netflix'],
        c_shop: ['Zara', 'H&M', 'Bookstore Tirana', 'Electronics'],
        c_sub:  ['Spotify Premium', 'Netflix', 'ChatGPT Plus', 'iCloud'],
        c_trav: ['Air Albania', 'Hotel Tirana', 'Booking.com'],
        c_other: ['Misc purchase', 'Donation', 'Repair'],
        c_edu: ['Online course', 'University fee', 'Books'],
      };

      let seed = 42;
      const rng = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
      const randInt = (lo, hi) => Math.floor(rng() * (hi - lo + 1)) + lo;
      const choice = (arr) => arr[Math.floor(rng() * arr.length)];

      for (let daysBack = 0; daysBack < 90; daysBack++) {
        const d = daysAgo(daysBack);
        const dateStr = dStr(d);

        // Salary on the 1st
        if (d.getDate() === 1) {
          txns.push({
            id: uid(), date: dateStr, type: 'income', amount: 75000,
            currency: 'ALL', accountId: 'a_chk', categoryId: 'c_sal',
            description: 'Monthly salary',
          });
        }

        // Housing rent on the 5th
        if (d.getDate() === 5) {
          txns.push({
            id: uid(), date: dateStr, type: 'expense', amount: 35000,
            currency: 'ALL', accountId: 'a_chk', categoryId: 'c_hous',
            description: 'Apartment rent',
          });
        }

        // Utilities mid-month
        if (d.getDate() === 12) {
          txns.push({
            id: uid(), date: dateStr, type: 'expense', amount: randInt(3500, 5500),
            currency: 'ALL', accountId: 'a_chk', categoryId: 'c_util',
            description: choice(merchantsByCategory.c_util),
          });
        }

        // Random daily expenses
        const numExpenses = randInt(0, 3);
        for (let i = 0; i < numExpenses; i++) {
          const expenseCats = ['c_groc', 'c_groc', 'c_rest', 'c_tran', 'c_shop', 'c_ent', 'c_heal', 'c_sub', 'c_other'];
          const cat = choice(expenseCats);
          const amountRanges = {
            c_groc: [500, 4500],   c_rest: [800, 3500],   c_tran: [200, 1500],
            c_shop: [1500, 8000],  c_ent:  [400, 2200],   c_heal: [500, 3000],
            c_sub:  [500, 2000],   c_other: [300, 2000],
          };
          const [lo, hi] = amountRanges[cat];
          txns.push({
            id: uid(), date: dateStr, type: 'expense', amount: randInt(lo, hi),
            currency: 'ALL', accountId: choice(['a_chk', 'a_cash']),
            categoryId: cat, description: choice(merchantsByCategory[cat] || ['Purchase']),
          });
        }

        // Occasional freelance income
        if (daysBack % 17 === 0) {
          txns.push({
            id: uid(), date: dateStr, type: 'income', amount: randInt(5000, 25000),
            currency: 'ALL', accountId: 'a_chk', categoryId: 'c_free',
            description: 'Client invoice',
          });
        }
      }

      const budgets = [
        { id: uid(), categoryId: 'c_groc',  name: 'Groceries',    amount: 25000, period: 'monthly', currency: 'ALL', startDate: dStr(monthStart), warnThreshold: 80 },
        { id: uid(), categoryId: 'c_rest',  name: 'Restaurants',  amount: 12000, period: 'monthly', currency: 'ALL', startDate: dStr(monthStart), warnThreshold: 80 },
        { id: uid(), categoryId: 'c_tran',  name: 'Transport',    amount: 8000,  period: 'monthly', currency: 'ALL', startDate: dStr(monthStart), warnThreshold: 80 },
        { id: uid(), categoryId: 'c_ent',   name: 'Entertainment',amount: 6000,  period: 'monthly', currency: 'ALL', startDate: dStr(monthStart), warnThreshold: 80 },
        { id: uid(), categoryId: 'c_shop',  name: 'Shopping',     amount: 15000, period: 'monthly', currency: 'ALL', startDate: dStr(monthStart), warnThreshold: 80 },
      ];

      const goals = [
        { id: uid(), name: 'Emergency fund',    target: 300000, current: 185000, currency: 'ALL',
          targetDate: dStr(new Date(today.getFullYear(), today.getMonth() + 6, 1)), color: '#10B981',
          description: 'Six months of essential expenses set aside.' },
        { id: uid(), name: 'New laptop',        target: 200000, current: 78000,  currency: 'ALL',
          targetDate: dStr(new Date(today.getFullYear(), today.getMonth() + 4, 15)), color: '#F59E0B',
          description: 'MacBook Pro upgrade.' },
        { id: uid(), name: 'Summer trip',       target: 120000, current: 35000,  currency: 'ALL',
          targetDate: dStr(new Date(today.getFullYear(), 6, 1)), color: '#3B82F6',
          description: 'Two weeks in Greece with family.' },
      ];

      return {
        user: { name: 'Demo User', email: 'demo@example.com', defaultCurrency: 'ALL' },
        accounts, categories, transactions: txns, budgets, goals,
      };
    }

    // ====================================================================
    // STATE: useReducer for everything
    // --------------------------------------------------------------------
    // A single reducer keeps state changes auditable and serializable.
    // Persistence is a side-effect via useEffect.
    // ====================================================================

    function reducer(state, action) {
      switch (action.type) {
        case 'CREATE_TXN':
          return { ...state, transactions: [{ id: uid(), ...action.payload }, ...state.transactions] };
        case 'UPDATE_TXN':
          return { ...state, transactions: state.transactions.map(t =>
            t.id === action.payload.id ? { ...t, ...action.payload } : t) };
        case 'DELETE_TXN':
          return { ...state, transactions: state.transactions.filter(t => t.id !== action.payload) };

        case 'CREATE_ACCOUNT':
          return { ...state, accounts: [...state.accounts, { id: uid(), ...action.payload }] };
        case 'UPDATE_ACCOUNT':
          return { ...state, accounts: state.accounts.map(a =>
            a.id === action.payload.id ? { ...a, ...action.payload } : a) };
        case 'DELETE_ACCOUNT':
          return {
            ...state,
            accounts: state.accounts.filter(a => a.id !== action.payload),
            transactions: state.transactions.filter(t => t.accountId !== action.payload),
          };

        case 'CREATE_BUDGET':
          return { ...state, budgets: [...state.budgets, { id: uid(), ...action.payload }] };
        case 'UPDATE_BUDGET':
          return { ...state, budgets: state.budgets.map(b =>
            b.id === action.payload.id ? { ...b, ...action.payload } : b) };
        case 'DELETE_BUDGET':
          return { ...state, budgets: state.budgets.filter(b => b.id !== action.payload) };

        case 'CREATE_GOAL':
          return { ...state, goals: [...state.goals, { id: uid(), ...action.payload }] };
        case 'UPDATE_GOAL':
          return { ...state, goals: state.goals.map(g =>
            g.id === action.payload.id ? { ...g, ...action.payload } : g) };
        case 'DELETE_GOAL':
          return { ...state, goals: state.goals.filter(g => g.id !== action.payload) };
        case 'CONTRIBUTE_GOAL':
          return { ...state, goals: state.goals.map(g =>
            g.id === action.payload.id ? { ...g, current: Math.min(g.target, g.current + action.payload.amount) } : g) };

        case 'CREATE_CATEGORY':
          return { ...state, categories: [...state.categories, { id: uid(), ...action.payload }] };
        case 'DELETE_CATEGORY':
          return { ...state, categories: state.categories.filter(c => c.id !== action.payload) };

        case 'UPDATE_USER':
          return { ...state, user: { ...state.user, ...action.payload } };

        case 'RESET':
          return seed();

        default:
          return state;
      }
    }

    // ====================================================================
    // FORMATTERS
    // ====================================================================

    const CURRENCY_LOCALES = {
      ALL: { locale: 'sq-AL', symbol: 'L', decimals: 0 },
      EUR: { locale: 'de-DE', symbol: '€', decimals: 2 },
      USD: { locale: 'en-US', symbol: '$', decimals: 2 },
      GBP: { locale: 'en-GB', symbol: '£', decimals: 2 },
      CHF: { locale: 'de-CH', symbol: 'CHF', decimals: 2 },
    };

    function formatCurrency(amount, currency = 'ALL', { compact = false } = {}) {
      const cfg = CURRENCY_LOCALES[currency] || CURRENCY_LOCALES.ALL;
      const opts = {
        style: 'decimal',
        minimumFractionDigits: compact ? 0 : cfg.decimals,
        maximumFractionDigits: compact ? 0 : cfg.decimals,
      };
      if (compact && Math.abs(amount) >= 1000) {
        opts.notation = 'compact';
        opts.maximumFractionDigits = 1;
      }
      return `${cfg.symbol}${new Intl.NumberFormat(cfg.locale, opts).format(amount)}`;
    }

    function formatDate(d, { format = 'short' } = {}) {
      const date = typeof d === 'string' ? new Date(d) : d;
      if (format === 'short') {
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
      }
      return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    // ====================================================================
    // SELECTORS (memoized via useMemo at call sites)
    // ====================================================================

    function accountBalance(state, accountId) {
      const acc = state.accounts.find(a => a.id === accountId);
      if (!acc) return 0;
      let bal = acc.initialBalance;
      for (const t of state.transactions) {
        if (t.accountId !== accountId) continue;
        if (t.type === 'income') bal += t.amount;
        else if (t.type === 'expense') bal -= t.amount;
      }
      return bal;
    }

    function monthlyTotals(state, monthsBack = 12) {
      const today = new Date();
      const buckets = [];
      for (let i = monthsBack - 1; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        buckets.push({
          label: d.toLocaleDateString('en-US', { month: 'short' }),
          year: d.getFullYear(), month: d.getMonth(),
          income: 0, expense: 0, net: 0,
        });
      }
      for (const t of state.transactions) {
        const td = new Date(t.date);
        const bucket = buckets.find(b => b.year === td.getFullYear() && b.month === td.getMonth());
        if (bucket) {
          if (t.type === 'income') bucket.income += t.amount;
          else if (t.type === 'expense') bucket.expense += t.amount;
        }
      }
      buckets.forEach(b => b.net = b.income - b.expense);
      return buckets;
    }

    function spendingByCategory(state, periodStart, periodEnd) {
      const totals = {};
      for (const t of state.transactions) {
        if (t.type !== 'expense') continue;
        const td = new Date(t.date);
        if (td < periodStart || td > periodEnd) continue;
        totals[t.categoryId] = (totals[t.categoryId] || 0) + t.amount;
      }
      return state.categories
        .filter(c => c.type === 'expense' && totals[c.id])
        .map(c => ({ ...c, total: totals[c.id] }))
        .sort((a, b) => b.total - a.total);
    }

    function thisMonth() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end   = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
      return [start, end];
    }

    function last30Days() {
      const end = new Date();
      const start = new Date(); start.setDate(end.getDate() - 30);
      return [start, end];
    }

    function budgetProgress(state, budget) {
      const [start, end] = thisMonth();
      let spent = 0;
      for (const t of state.transactions) {
        if (t.type !== 'expense' || t.categoryId !== budget.categoryId) continue;
        const td = new Date(t.date);
        if (td >= start && td <= end) spent += t.amount;
      }
      const percent = (spent / budget.amount) * 100;
      const status = percent >= 100 ? 'over' : percent >= budget.warnThreshold ? 'warning' : 'on_track';
      return { spent, remaining: budget.amount - spent, percent, status };
    }

      return (

    function monthlyAccountChange(state, accountId) {
      const [start, end] = thisMonth();
      let change = 0;
      for (const t of state.transactions) {
        if (t.accountId !== accountId) continue;
        const td = new Date(t.date);
        if (td < start || td > end) continue;
        if (t.type === 'income') change += t.amount;
        else if (t.type === 'expense') change -= t.amount;
      }
      return change;
    }

    function Reports() {
      const { state } = useStore();
      const [range, setRange] = useState('30');
      const cur = state.user.defaultCurrency;

      const [start, end] = useMemo(() => {
        const e = new Date();
        const s = new Date(); s.setDate(e.getDate() - Number(range));
        return [s, e];
      }, [range]);

      const byCategory = useMemo(() => spendingByCategory(state, start, end), [state, start, end]);
      const monthly = useMemo(() => monthlyTotals(state, 12), [state]);

      const daily = useMemo(() => {
        const days = {};
        const dayStr = (d) => d.toISOString().slice(0, 10);
        for (let i = Number(range); i >= 0; i--) {
          const d = new Date(end); d.setDate(end.getDate() - i);
          days[dayStr(d)] = { date: dayStr(d), label: formatDate(d), total: 0 };
        }
        for (const t of state.transactions) {
          if (t.type !== 'expense') continue;
          if (!days[t.date]) continue;
          days[t.date].total += t.amount;
        }
        return Object.values(days);
      }, [state.transactions, range, end]);

      const netWorth = useMemo(() => {
        // Compute running net worth at end of each of the last 12 months
        const today = new Date();
        const months = [];
        for (let i = 11; i >= 0; i--) {
          const d = new Date(today.getFullYear(), today.getMonth() - i + 1, 0); // last day of that month
          months.push({ date: d, label: d.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }) });
        }
        const initial = state.accounts.reduce((s, a) => s + a.initialBalance, 0);
        return months.map(m => {
          let bal = initial;
          for (const t of state.transactions) {
            if (new Date(t.date) > m.date) continue;
            if (t.type === 'income') bal += t.amount;
            else if (t.type === 'expense') bal -= t.amount;
          }
          return { label: m.label, netWorth: bal };
        });
      }, [state]);

      const topMerchants = useMemo(() => {
        const totals = {};
        for (const t of state.transactions) {
          if (t.type !== 'expense' || !t.description) continue;
          const td = new Date(t.date);
          if (td < start || td > end) continue;
          totals[t.description] = (totals[t.description] || 0) + t.amount;
        }
        return Object.entries(totals)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8)
          .map(([name, total]) => ({ name, total }));
      }, [state.transactions, start, end]);

      const downloadCsv = () => {
        const rows = [['Date', 'Type', 'Amount', 'Currency', 'Category', 'Account', 'Description']];
        for (const t of state.transactions) {
          const cat = state.categories.find(c => c.id === t.categoryId)?.name || '';
          const acc = state.accounts.find(a => a.id === t.accountId)?.name || '';
          rows.push([t.date, t.type, t.amount, t.currency, cat, acc, t.description || '']);
        }
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'transactions.csv'; a.click();
        URL.revokeObjectURL(url);
      };

      return (
        <div>
          <PageHeader
            title="Reports"
            subtitle="Patterns the spreadsheet wouldn’t show you."
            actions={
              <>
                <select className="select" style={{ width: 'auto' }} value={range}
                  onChange={e => setRange(e.target.value)}>
                  <option value="7">Last 7 days</option>
                  <option value="30">Last 30 days</option>
                  <option value="90">Last 90 days</option>
                  <option value="365">Last year</option>
                </select>
                <button className="btn btn-secondary" onClick={downloadCsv}>
                  <Icon name="download" size={14} /> Export CSV
                </button>
              </>
            }
          />

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <div className="card">
              <h2 className="display-serif text-2xl italic mb-4">Daily spending</h2>
              <div style={{ height: 280 }}>
                <ResponsiveContainer>
                  <AreaChart data={daily}>
                    <defs>
                      <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor="#F59E0B" stopOpacity={0.4} />
                        <stop offset="100%" stopColor="#F59E0B" stopOpacity={0} />
                      </linearGradient>
                    </defs>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EDE6D3" vertical={false} />
                    <XAxis dataKey="label" stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={10}
                      interval="preserveStartEnd" />
                    <YAxis stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={10}
                      tickFormatter={(v) => formatCurrency(v, cur, { compact: true })} />
                    <Tooltip
                      contentStyle={{ borderRadius: 10, border: '1px solid #EDE6D3', background: '#fff' }}
                      formatter={(v) => formatCurrency(v, cur)} />
                    <Area type="monotone" dataKey="total" stroke="#F59E0B" strokeWidth={2}
                      fill="url(#g1)" />
                  </AreaChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="card">
              <h2 className="display-serif text-2xl italic mb-4">Net worth trajectory</h2>
              <div style={{ height: 280 }}>
                <ResponsiveContainer>
                  <LineChart data={netWorth}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#EDE6D3" vertical={false} />
                    <XAxis dataKey="label" stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={10} />
                    <YAxis stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={10}
                      tickFormatter={(v) => formatCurrency(v, cur, { compact: true })} />
                    <Tooltip
                      contentStyle={{ borderRadius: 10, border: '1px solid #EDE6D3', background: '#fff' }}
                      formatter={(v) => formatCurrency(v, cur)} />
                    <Line type="monotone" dataKey="netWorth" stroke="#0f172a" strokeWidth={2.5}
                      dot={{ fill: '#0f172a', r: 3 }} activeDot={{ r: 5 }} />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div className="card">
              <h2 className="display-serif text-2xl italic mb-4">By category</h2>
              <div style={{ height: 280 }}>
                <ResponsiveContainer>
                  <BarChart data={byCategory.slice(0, 8)} layout="vertical" margin={{ left: 30 }}>
                    <XAxis type="number" stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={10}
                      tickFormatter={(v) => formatCurrency(v, cur, { compact: true })} />
                    <YAxis type="category" dataKey="name" stroke="#94a3b8" tickLine={false} axisLine={false} fontSize={11} width={90} />
                    <Tooltip
                      contentStyle={{ borderRadius: 10, border: '1px solid #EDE6D3', background: '#fff' }}
                      formatter={(v) => formatCurrency(v, cur)} />
                    <Bar dataKey="total" radius={[0, 4, 4, 0]}>
                      {byCategory.slice(0, 8).map(c => <Cell key={c.id} fill={c.color} />)}
                    </Bar>
                  </BarChart>
                </ResponsiveContainer>
              </div>
            </div>

            <div className="card">
              <h2 className="display-serif text-2xl italic mb-4">Top spending places</h2>
              {topMerchants.length === 0 ? (
                <div className="text-sm text-ink-500 py-12 text-center">No data in this range.</div>
              ) : (
                <ul className="space-y-2">
                  {topMerchants.map((m, i) => {
                    const max = topMerchants[0].total;
                    return (
                      <li key={m.name} className="flex items-center gap-3">
                        <span className="mono text-xs text-ink-500 w-6 tabular text-right">{i + 1}.</span>
                        <div className="flex-1 min-w-0">
                          <div className="flex justify-between text-sm mb-1">
                            <span className="truncate font-medium">{m.name}</span>
                            <span className="tabular shrink-0 ml-2">{formatCurrency(m.total, cur)}</span>
                          </div>
                          <div className="h-1.5 bg-cream-100 rounded-full overflow-hidden">
                            <div className="h-full bg-ink-900" style={{ width: `${(m.total / max) * 100}%` }} />
                          </div>
                        </div>
                      </li>
                    );
                  })}
                </ul>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ImportPage() {
      const { state, dispatch, showToast } = useStore();
      const [step, setStep] = useState(1);
      const [csvText, setCsvText] = useState('');
      const [parsed, setParsed] = useState(null);
      const [mapping, setMapping] = useState({ date_col: '', amount_col: '', description_col: '' });
      const [accountId, setAccountId] = useState(state.accounts[0]?.id || '');

      const SAMPLE_CSV = `Date,Description,Amount\n${new Date().toISOString().slice(0,10)},Coffee shop,-450\n${new Date(Date.now() - 86400000).toISOString().slice(0,10)},ATM withdrawal,-5000\n${new Date(Date.now() - 172800000).toISOString().slice(0,10)},Salary,75000\n`;

      const onFile = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          setCsvText(reader.result);
          previewCsv(reader.result);
          setStep(2);
        };
        reader.readAsText(f);
      };

      const previewCsv = (text) => {
        const lines = text.split('\n').filter(l => l.trim());
        if (lines.length === 0) return;
        const delim = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].split(delim).map(h => h.trim().replace(/^"|"$/g, ''));
        const rows = lines.slice(1, 6).map(l => l.split(delim).map(c => c.trim().replace(/^"|"$/g, '')));
        setParsed({ headers, rows, total: lines.length - 1 });
        // Auto-guess mapping
        const guess = {};
        for (const h of headers) {
          const lc = h.toLowerCase();
          if (!guess.date_col && /date|datum/.test(lc)) guess.date_col = h;
          if (!guess.amount_col && /amount|sum|value|debit|credit/.test(lc)) guess.amount_col = h;
          if (!guess.description_col && /desc|name|memo|narration|reference/.test(lc)) guess.description_col = h;
        }
        setMapping({ ...mapping, ...guess });
      };

      const doImport = () => {
        if (!mapping.date_col || !mapping.amount_col || !accountId) {
          showToast('Map date and amount columns first.', 'error'); return;
        }
        const lines = csvText.split('\n').filter(l => l.trim());
        const delim = lines[0].includes(';') ? ';' : ',';
        const headers = lines[0].split(delim).map(h => h.trim().replace(/^"|"$/g, ''));
        const dIdx = headers.indexOf(mapping.date_col);
        const aIdx = headers.indexOf(mapping.amount_col);
        const descIdx = mapping.description_col ? headers.indexOf(mapping.description_col) : -1;

        let inserted = 0;
        for (let i = 1; i < lines.length; i++) {
          const cells = lines[i].split(delim).map(c => c.trim().replace(/^"|"$/g, ''));
          const dateStr = cells[dIdx];
          const amountStr = cells[aIdx];
          if (!dateStr || !amountStr) continue;

          // Parse date
          let date = null;
          for (const fmt of [/^\d{4}-\d{2}-\d{2}$/, /^\d{2}\/\d{2}\/\d{4}$/, /^\d{2}\.\d{2}\.\d{4}$/]) {
            if (fmt.test(dateStr)) {
              if (dateStr.includes('-')) date = dateStr;
              else if (dateStr.includes('/')) { const [d, m, y] = dateStr.split('/'); date = `${y}-${m}-${d}`; }
              else if (dateStr.includes('.')) { const [d, m, y] = dateStr.split('.'); date = `${y}-${m}-${d}`; }
              break;
            }
          }
          if (!date) continue;

          // Parse amount
          let amount = amountStr.replace(/[^0-9.,\-()]/g, '');
          const isNeg = amount.startsWith('-') || (amount.startsWith('(') && amount.endsWith(')'));
          amount = amount.replace(/[()-]/g, '');
          if (amount.includes(',') && amount.includes('.')) {
            if (amount.lastIndexOf(',') > amount.lastIndexOf('.')) amount = amount.replace(/\./g, '').replace(',', '.');
            else amount = amount.replace(/,/g, '');
          } else if (amount.includes(',')) {
            if (/,\d{1,2}$/.test(amount)) amount = amount.replace(',', '.');
            else amount = amount.replace(/,/g, '');
          }
          const val = Math.abs(Number(amount));
          if (!val || isNaN(val)) continue;

          dispatch({
            type: 'CREATE_TXN',
            payload: {
              date, type: isNeg ? 'expense' : 'income', amount: val,
              accountId, currency: state.accounts.find(a => a.id === accountId)?.currency || 'ALL',
              description: descIdx >= 0 ? cells[descIdx] : '',
            },
          });
          inserted++;
        }
        showToast(`${inserted} transactions imported.`);
        setStep(3);
        setTimeout(() => { setStep(1); setCsvText(''); setParsed(null); }, 2500);
      };

      return (
        <div>
          <PageHeader title="Import CSV" subtitle="Bring statements in from your bank." />

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
            <div className="lg:col-span-2">
              {step === 1 && (
                <div className="card text-center py-16">
                  <div className="display-serif text-3xl italic text-ink-900 mb-2">Drop your CSV here</div>
                  <p className="text-sm text-ink-500 mb-6 max-w-md mx-auto">
                    We support most Albanian bank statement exports (BKT, Raiffeisen, Credins, Tirana Bank) and any generic CSV.
                  </p>
                  <label className="btn btn-primary inline-flex cursor-pointer">
                    <Icon name="upload" size={14} /> Choose file…
                    <input type="file" accept=".csv,text/csv" hidden onChange={onFile} />
                  </label>
                  <button className="btn btn-ghost ml-2"
                    onClick={() => { setCsvText(SAMPLE_CSV); previewCsv(SAMPLE_CSV); setStep(2); }}>
                    Use sample data
                  </button>
                </div>
              )}

              {step === 2 && parsed && (
                <div className="card">
                  <div className="mb-5">
                    <div className="text-xs text-ink-500 mb-1">Step 2 of 2</div>
                    <h2 className="display-serif text-2xl italic">Map your columns</h2>
                  </div>

                  <div className="grid grid-cols-3 gap-3 mb-5">
                    <div>
                      <label className="label">Date column</label>
                      <select className="select" value={mapping.date_col}
                        onChange={e => setMapping({ ...mapping, date_col: e.target.value })}>
                        <option value="">— pick —</option>
                        {parsed.headers.map(h => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label">Amount column</label>
                      <select className="select" value={mapping.amount_col}
                        onChange={e => setMapping({ ...mapping, amount_col: e.target.value })}>
                        <option value="">— pick —</option>
                        {parsed.headers.map(h => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="label">Description (optional)</label>
                      <select className="select" value={mapping.description_col}
                        onChange={e => setMapping({ ...mapping, description_col: e.target.value })}>
                        <option value="">— none —</option>
                        {parsed.headers.map(h => <option key={h} value={h}>{h}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="mb-5">
                    <label className="label">Import into account</label>
                    <select className="select" value={accountId} onChange={e => setAccountId(e.target.value)}>
                      {state.accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>

                  <div className="text-xs uppercase tracking-wider text-ink-500 mb-2">Preview (first 5 rows)</div>
                  <div className="overflow-auto rounded-lg border border-cream-200">
                    <table className="text-xs w-full">
                      <thead className="bg-cream-50">
                        <tr>{parsed.headers.map(h => (
                          <th key={h} className={`text-left p-2 font-medium ${
                            h === mapping.date_col || h === mapping.amount_col || h === mapping.description_col
                              ? 'bg-amber-100 text-amber-900' : 'text-ink-700'
                          }`}>{h}</th>
                        ))}</tr>
                      </thead>
                      <tbody>
                        {parsed.rows.map((r, i) => (
                          <tr key={i} className="border-t border-cream-200">
                            {r.map((c, j) => <td key={j} className="p-2 text-ink-700 mono">{c}</td>)}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex justify-between mt-5">
                    <button className="btn btn-secondary" onClick={() => { setStep(1); setParsed(null); setCsvText(''); }}>
                      ← Start over
                    </button>
                    <button className="btn btn-primary" onClick={doImport}>
                      Import {parsed.total} rows →
                    </button>
                  </div>
                </div>
              )}

              {step === 3 && (
                <div className="card text-center py-16">
                  <div className="w-16 h-16 rounded-full bg-emerald-500/20 grid place-items-center mx-auto mb-4">
                    <Icon name="check" size={28} className="text-emerald-600" />
                  </div>
                  <div className="display-serif text-3xl italic">Imported.</div>
                </div>
              )}
            </div>

            <aside className="card">
              <h3 className="display-serif text-xl italic mb-3">How importing works</h3>
              <ol className="text-sm space-y-3 text-ink-700">
                <li className="flex gap-3">
                  <span className="w-6 h-6 rounded-full bg-cream-100 grid place-items-center font-medium text-xs shrink-0">1</span>
                  <span>Upload a CSV exported from your bank.</span>
                </li>
                <li className="flex gap-3">
                  <span className="w-6 h-6 rounded-full bg-cream-100 grid place-items-center font-medium text-xs shrink-0">2</span>
                  <span>We auto-detect the date and amount columns, but you can override.</span>
                </li>
                <li className="flex gap-3">
                  <span className="w-6 h-6 rounded-full bg-cream-100 grid place-items-center font-medium text-xs shrink-0">3</span>
                  <span>Negative amounts become expenses, positive become income.</span>
                </li>
                <li className="flex gap-3">
                  <span className="w-6 h-6 rounded-full bg-cream-100 grid place-items-center font-medium text-xs shrink-0">4</span>
                  <span>Re-importing the same file is safe — duplicates are detected by content hash.</span>
                </li>
              </ol>
              <div className="mt-5 p-3 rounded-lg bg-cream-50 text-xs text-ink-600">
                <strong>Tip:</strong> EU date formats (DD/MM/YYYY) and EU number formats (1.234,56) are both supported.
              </div>
            </aside>
          </div>
        </div>
      );
    }

                  <option value="CHF">CHF — Swiss Franc</option>
                </select>
              </div>
              <div className="pt-2">
                <button className="btn btn-primary" type="submit">Save changes</button>
              </div>
            </form>

            <div className="space-y-4">
              <div className="card">
                <h3 className="display-serif text-xl italic mb-3">About this demo</h3>
                <p className="text-sm text-ink-600 leading-relaxed">
                  This is a fully working, single-file version of the Personal Finance Tracker built for thesis defense purposes.
                  All data lives in your browser's <span className="mono text-xs">localStorage</span> — nothing is sent anywhere.
                </p>
                <div className="mt-3 text-xs text-ink-500">
                  Production version: Flask + React + PostgreSQL with JWT auth.
                </div>
              </div>
              <div className="card border-red-200">
                <h3 className="display-serif text-xl italic mb-3 text-red-700">Danger zone</h3>
                <p className="text-sm text-ink-600 mb-3">Reset everything back to the seed dataset.</p>
                <button className="btn btn-danger w-full justify-center"
                  onClick={() => {
                    if (confirm('Wipe all demo data and reseed?')) {
                      dispatch({ type: 'RESET' });
                      showToast('Reset complete.');
                    }
                  }}>
                  <Icon name="trash" size={14} /> Reset demo data
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ====================================================================
    // APP
    // ====================================================================

    // ====================================================================
    // CATEGORIES — manage income & expense categories
    // ====================================================================

    function Categories() {
      const { state, dispatch, showToast } = useStore();
      const [showForm, setShowForm] = useState(false);
      const [tab, setTab] = useState('expense');

      // Count usage per category for context
      const usageById = useMemo(() => {
        const m = {};
        for (const t of state.transactions) {
          if (t.categoryId) m[t.categoryId] = (m[t.categoryId] || 0) + 1;
        }
        return m;
      }, [state.transactions]);

      const filtered = state.categories.filter(c => c.type === tab);

      return (
        <div>
          <PageHeader
            title="Categories"
            subtitle={`${state.categories.length} total · ${state.categories.filter(c => c.type === 'expense').length} expense, ${state.categories.filter(c => c.type === 'income').length} income`}
            actions={
              <button className="btn btn-primary" onClick={() => setShowForm(true)}>
                <Icon name="plus" size={14} /> New category
              </button>
            }
          />

          <div className="grid grid-cols-2 gap-1 p-1 bg-cream-100 rounded-lg mb-4 max-w-xs">
            {['expense', 'income'].map(t => (
              <button
                key={t}
                className={`py-2 rounded-md text-sm font-medium transition-all capitalize ${tab === t ? 'bg-white shadow-sm text-ink-900' : 'text-ink-500'}`}
                onClick={() => setTab(t)}
              >
                {t}
              </button>
            ))}
          </div>

          <div className="card p-0 overflow-hidden">
            {filtered.length === 0 ? (
              <div className="py-16 text-center text-ink-500 text-sm">
                No {tab} categories yet.
              </div>
            ) : (
              <ul className="divide-y divide-cream-200">
                {filtered.map(c => {
                  const uses = usageById[c.id] || 0;
                  return (
                    <li
                      key={c.id}
                      className="flex items-center justify-between px-6 py-3 hover:bg-cream-50 transition-colors group"
                    >
                      <div className="flex items-center gap-3 min-w-0">
                        <span
                          className="w-3 h-3 rounded-full shrink-0"
                          style={{ background: c.color }}
                        />
                        <div className="min-w-0">
                          <div className="text-sm font-medium truncate">{c.name}</div>
                          <div className="text-xs text-ink-500">
                            {uses === 0 ? 'Unused' : `${uses} transaction${uses === 1 ? '' : 's'}`}
                          </div>
                        </div>
                      </div>
                      <div className="opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                        <button
                          className="btn btn-ghost px-2 py-1 text-red-600"
                          onClick={() => {
                            if (uses > 0) {
                              showToast(`Cannot delete: ${uses} transaction${uses === 1 ? ' uses' : 's use'} this category.`, 'error');
                              return;
                            }
                            if (confirm(`Delete category "${c.name}"?`)) {
                              dispatch({ type: 'DELETE_CATEGORY', payload: c.id });
                              showToast('Category deleted.');
                            }
                          }}
                        >
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>

          {showForm && (
            <CategoryForm
              defaultType={tab}
              onClose={() => setShowForm(false)}
              onSave={data => {
                dispatch({ type: 'CREATE_CATEGORY', payload: data });
                showToast('Category created.');
                setShowForm(false);
              }}
            />
          )}
        </div>
      );
    }

    function CategoryForm({ defaultType, onClose, onSave }) {
      const PRESET_COLORS = ['#EF4444', '#F59E0B', '#F97316', '#3B82F6', '#0EA5E9', '#EC4899', '#A855F7', '#8B5CF6', '#14B8A6', '#10B981', '#22C55E', '#84CC16', '#6366F1', '#06B6D4'];
      const [form, setForm] = useState({
        name: '',
        type: defaultType || 'expense',
        color: PRESET_COLORS[0],
      });
      const submit = e => {
        e.preventDefault();
        if (!form.name.trim()) return;
        onSave({ name: form.name.trim(), type: form.type, color: form.color });
      };
      return (
        <Modal
          title="New category"
          onClose={onClose}
          footer={
            <>
              <button className="btn btn-secondary" onClick={onClose}>Cancel</button>
              <button className="btn btn-primary" onClick={submit}>Create</button>
            </>
          }
        >
          <form onSubmit={submit} className="space-y-4">
            <div className="grid grid-cols-2 gap-1 p-1 bg-cream-100 rounded-lg">
              {['expense', 'income'].map(t => (
                <button
                  key={t}
                  type="button"
                  className={`py-2 rounded-md text-sm font-medium transition-all capitalize ${form.type === t ? 'bg-white shadow-sm text-ink-900' : 'text-ink-500'}`}
                  onClick={() => setForm({ ...form, type: t })}
                >
                  {t}
                </button>
              ))}
            </div>

            <div>
              <label className="label">Name</label>
              <input
                className="input"
                placeholder="e.g. Subscriptions"
                value={form.name}
                onChange={e => setForm({ ...form, name: e.target.value })}
                required
                autoFocus
              />
            </div>

            <div>
              <label className="label">Color</label>
              <div className="flex flex-wrap gap-2">
                {PRESET_COLORS.map(c => (
                  <button
                    key={c}
                    type="button"
                    className={`w-8 h-8 rounded-lg transition-all ${form.color === c ? 'ring-2 ring-offset-2 ring-ink-900' : ''}`}
                    style={{ background: c }}
                    onClick={() => setForm({ ...form, color: c })}
                  />
                ))}
              </div>
            </div>
          </form>
        </Modal>
      );
    }

    function App() {
      const [page, setPage] = useState('dashboard');

      const pages = {
        dashboard:    <Dashboard onNavigate={setPage} />,
        accounts:     <Accounts />,
        transactions: <Transactions />,
        budgets:      <Budgets />,
        goals:        <Goals />,
        reports:      <Reports />,
        categories:   <Categories />,
        import:       <ImportPage />,
        settings:     <Settings />,
      };

      return (
        <div className="flex min-h-screen">
          <Sidebar current={page} onNavigate={setPage} />
          <main className="flex-1 min-w-0 bg-cream-50">
            <div className="max-w-6xl mx-auto px-10 py-10">
              {pages[page]}
            </div>
          </main>
        </div>
      );
    }

    const _ReactDOM = window.ReactDOM;
    const _createRoot = _ReactDOM.createRoot ?? _ReactDOM.default?.createRoot;
    _createRoot(document.getElementById('root')).render(
      <StoreProvider><App /></StoreProvider>
    );
  </script>
</body>
</html>
