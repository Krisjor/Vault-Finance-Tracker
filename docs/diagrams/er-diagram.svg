<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .table-title { font-size: 14px; font-weight: 700; fill: #fff; }
      .table-sub   { font-size: 10px; fill: #fff; opacity: 0.75; font-style: italic; }
      .col         { font-size: 12px; fill: #1e293b; }
      .col-pk      { font-size: 12px; fill: #1e293b; font-weight: 600; }
      .col-fk      { font-size: 12px; fill: #475569; }
      .col-type    { font-size: 10px; fill: #94a3b8; font-family: "JetBrains Mono", monospace; }
      .rel-label   { font-size: 11px; fill: #475569; font-weight: 500; }
      .rel-cardinality { font-size: 14px; fill: #1e293b; font-weight: 600; }
      .figure-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .figure-sub   { font-size: 13px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1240" height="880" fill="#FBF9F4"/>

  <!-- Title -->
  <text x="40" y="44" class="figure-title">Entity-Relationship Diagram</text>
  <text x="40" y="64" class="figure-sub">Personal Finance Tracker · 7 entity tables + 1 junction (third normal form, 3NF)</text>

  <!-- ============= USERS table (top center) ============= -->
  <g transform="translate(540, 100)">
    <rect width="200" height="32" rx="6" fill="#0F172A"/>
    <text x="14" y="20" class="table-title">users</text>
    <text x="160" y="20" class="table-sub">1</text>

    <rect y="32" width="200" height="174" rx="0" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="190" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col">email</text>
    <text x="190" y="78" text-anchor="end" class="col-type">unique</text>

    <text x="14" y="96" class="col">password_hash</text>
    <text x="190" y="96" text-anchor="end" class="col-type">bcrypt</text>

    <text x="14" y="114" class="col">full_name</text>
    <text x="14" y="132" class="col">default_currency</text>
    <text x="190" y="132" text-anchor="end" class="col-type">ALL</text>

    <text x="14" y="150" class="col">locale</text>
    <text x="190" y="150" text-anchor="end" class="col-type">sq-AL</text>

    <text x="14" y="168" class="col">is_active</text>
    <text x="14" y="186" class="col">created_at</text>
    <text x="14" y="202" class="col">last_login_at</text>
  </g>

  <!-- ============= ACCOUNTS table (top left) ============= -->
  <g transform="translate(80, 290)">
    <rect width="200" height="32" rx="6" fill="#3B82F6"/>
    <text x="14" y="20" class="table-title">accounts</text>
    <text x="160" y="20" class="table-sub">N</text>

    <rect y="32" width="200" height="174" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="190" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col-fk">user_id</text>
    <text x="190" y="78" text-anchor="end" class="col-type">FK→users</text>

    <text x="14" y="96" class="col">name</text>
    <text x="14" y="114" class="col">account_type</text>
    <text x="190" y="114" text-anchor="end" class="col-type">enum</text>

    <text x="14" y="132" class="col">currency</text>
    <text x="14" y="150" class="col">initial_balance</text>
    <text x="190" y="150" text-anchor="end" class="col-type">Num(15,2)</text>

    <text x="14" y="168" class="col">current_balance</text>
    <text x="190" y="168" text-anchor="end" class="col-type">Num(15,2)</text>

    <text x="14" y="186" class="col">credit_limit</text>
    <text x="14" y="204" class="col">color · icon · notes</text>
  </g>

  <!-- ============= CATEGORIES table (top right) ============= -->
  <g transform="translate(960, 290)">
    <rect width="200" height="32" rx="6" fill="#F59E0B"/>
    <text x="14" y="20" class="table-title">categories</text>
    <text x="160" y="20" class="table-sub">N</text>

    <rect y="32" width="200" height="174" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="190" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col-fk">user_id</text>
    <text x="190" y="78" text-anchor="end" class="col-type">FK→users</text>

    <text x="14" y="96" class="col-fk">parent_id</text>
    <text x="190" y="96" text-anchor="end" class="col-type">FK→self</text>

    <text x="14" y="114" class="col">name</text>
    <text x="14" y="132" class="col">category_type</text>
    <text x="190" y="132" text-anchor="end" class="col-type">enum</text>

    <text x="14" y="150" class="col">color</text>
    <text x="14" y="168" class="col">icon</text>
    <text x="14" y="186" class="col">is_system</text>
    <text x="14" y="204" class="col">is_archived</text>
  </g>

  <!-- ============= TRANSACTIONS table (center) ============= -->
  <g transform="translate(440, 480)">
    <rect width="280" height="32" rx="6" fill="#8B5CF6"/>
    <text x="14" y="20" class="table-title">transactions</text>
    <text x="240" y="20" class="table-sub">central entity</text>

    <rect y="32" width="280" height="244" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="280" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="270" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col-fk">user_id</text>
    <text x="270" y="78" text-anchor="end" class="col-type">FK→users</text>

    <text x="14" y="96" class="col-fk">account_id</text>
    <text x="270" y="96" text-anchor="end" class="col-type">FK→accounts</text>

    <text x="14" y="114" class="col-fk">category_id</text>
    <text x="270" y="114" text-anchor="end" class="col-type">FK→categories</text>

    <text x="14" y="132" class="col">transaction_type</text>
    <text x="270" y="132" text-anchor="end" class="col-type">income|expense|transfer</text>

    <text x="14" y="150" class="col">amount</text>
    <text x="270" y="150" text-anchor="end" class="col-type">Num(15,2) &gt; 0</text>

    <text x="14" y="168" class="col">currency</text>
    <text x="14" y="186" class="col">transaction_date</text>
    <text x="270" y="186" text-anchor="end" class="col-type">indexed</text>

    <text x="14" y="204" class="col">description</text>
    <text x="14" y="222" class="col-fk">transfer_pair_id</text>
    <text x="270" y="222" text-anchor="end" class="col-type">FK→self</text>

    <text x="14" y="240" class="col">is_recurring</text>
    <text x="14" y="258" class="col">import_hash</text>
    <text x="270" y="258" text-anchor="end" class="col-type">SHA-256</text>
  </g>

  <!-- ============= TAGS table (bottom right) ============= -->
  <g transform="translate(960, 540)">
    <rect width="200" height="32" rx="6" fill="#EC4899"/>
    <text x="14" y="20" class="table-title">tags</text>
    <text x="160" y="20" class="table-sub">N</text>

    <rect y="32" width="200" height="98" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="190" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col-fk">user_id</text>
    <text x="190" y="78" text-anchor="end" class="col-type">FK→users</text>

    <text x="14" y="96" class="col">name</text>
    <text x="14" y="114" class="col">color</text>
  </g>

  <!-- ============= transaction_tags JUNCTION ============= -->
  <g transform="translate(820, 670)">
    <rect width="120" height="28" rx="6" fill="#64748B" stroke="none"/>
    <text x="60" y="18" text-anchor="middle" class="table-title" font-size="11">transaction_tags</text>

    <rect y="28" width="120" height="60" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <text x="10" y="46" font-size="10" fill="#475569">txn_id</text>
    <text x="110" y="46" text-anchor="end" font-size="9" fill="#94a3b8">FK</text>
    <text x="10" y="62" font-size="10" fill="#475569">tag_id</text>
    <text x="110" y="62" text-anchor="end" font-size="9" fill="#94a3b8">FK</text>
    <text x="10" y="80" font-size="9" fill="#94a3b8" font-style="italic">junction</text>
  </g>

  <!-- ============= BUDGETS table (bottom left) ============= -->
  <g transform="translate(80, 540)">
    <rect width="200" height="32" rx="6" fill="#10B981"/>
    <text x="14" y="20" class="table-title">budgets</text>
    <text x="160" y="20" class="table-sub">N</text>

    <rect y="32" width="200" height="174" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#E2E8F0"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="190" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="78" class="col-fk">user_id</text>
    <text x="190" y="78" text-anchor="end" class="col-type">FK→users</text>

    <text x="14" y="96" class="col-fk">category_id</text>
    <text x="190" y="96" text-anchor="end" class="col-type">FK→categories</text>

    <text x="14" y="114" class="col">name</text>
    <text x="14" y="132" class="col">amount</text>
    <text x="190" y="132" text-anchor="end" class="col-type">Num(15,2)</text>

    <text x="14" y="150" class="col">period</text>
    <text x="190" y="150" text-anchor="end" class="col-type">monthly|qtr|yr</text>

    <text x="14" y="168" class="col">start_date</text>
    <text x="14" y="186" class="col">warn_threshold</text>
    <text x="14" y="204" class="col">is_active</text>
  </g>

  <!-- ============= GOALS table (bottom) ============= -->
  <g transform="translate(440, 760)">
    <rect width="280" height="32" rx="6" fill="#06B6D4"/>
    <text x="14" y="20" class="table-title">goals</text>
    <text x="240" y="20" class="table-sub">N</text>

    <rect y="32" width="280" height="84" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>

    <text x="14" y="52" class="col-pk">id</text>
    <text x="270" y="52" text-anchor="end" class="col-type">PK</text>

    <text x="14" y="70" class="col-fk">user_id · linked_account_id</text>
    <text x="14" y="88" class="col">target_amount · current_amount · target_date</text>
    <text x="14" y="106" class="col">currency · color · description · is_completed</text>
  </g>

  <!-- ===========================================================
       RELATIONSHIP LINES
       =========================================================== -->

  <!-- users → accounts (1:N) -->
  <path d="M 540 195 Q 350 195 180 290" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="220" class="rel-cardinality">1</text>
  <text x="220" y="285" class="rel-cardinality">N</text>
  <text x="280" y="255" class="rel-label">owns</text>

  <!-- users → categories (1:N) -->
  <path d="M 740 195 Q 920 195 1060 290" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="900" y="220" class="rel-cardinality">1</text>
  <text x="1020" y="285" class="rel-cardinality">N</text>
  <text x="960" y="255" class="rel-label">defines</text>

  <!-- users → transactions (1:N) -->
  <path d="M 640 206 L 580 480" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="240" class="rel-cardinality">1</text>
  <text x="600" y="470" class="rel-cardinality">N</text>

  <!-- accounts → transactions (1:N) -->
  <path d="M 280 400 Q 360 440 440 540" stroke="#3B82F6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="300" y="430" class="rel-cardinality" fill="#3B82F6">1</text>
  <text x="430" y="525" class="rel-cardinality" fill="#3B82F6">N</text>
  <text x="350" y="465" class="rel-label" fill="#3B82F6">recorded in</text>

  <!-- categories → transactions (1:N) -->
  <path d="M 960 400 Q 850 450 720 540" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="940" y="430" class="rel-cardinality" fill="#D97706">1</text>
  <text x="730" y="525" class="rel-cardinality" fill="#D97706">N</text>
  <text x="830" y="465" class="rel-label" fill="#D97706">classifies</text>

  <!-- users → budgets (1:N) -->
  <path d="M 540 195 Q 320 350 180 540" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="2,3"/>

  <!-- categories → budgets (1:N) -->
  <path d="M 960 460 Q 600 500 280 580" stroke="#10B981" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="290" y="575" class="rel-cardinality" fill="#10B981">N</text>
  <text x="500" y="495" class="rel-label" fill="#059669">caps spend in</text>

  <!-- users → goals -->
  <path d="M 640 206 Q 700 480 600 760" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="2,3"/>

  <!-- users → tags -->
  <path d="M 740 195 Q 950 350 1060 540" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="2,3"/>

  <!-- transactions ↔ tags via junction (M:N) -->
  <path d="M 720 600 L 820 690" stroke="#8B5CF6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="760" y="640" class="rel-cardinality" fill="#7C3AED">N</text>

  <path d="M 940 690 L 960 620" stroke="#EC4899" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="945" y="660" class="rel-cardinality" fill="#DB2777">N</text>

  <text x="800" y="730" class="rel-label" fill="#475569">many-to-many via junction table</text>

  <!-- transactions → transactions (transfer pair, self-ref) -->
  <path d="M 720 540 Q 800 500 820 540 Q 830 600 720 620" stroke="#7C3AED" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="770" y="535" class="rel-label" fill="#7C3AED" font-size="10">transfer_pair (self-ref)</text>

  <!-- categories → categories (parent, self-ref) -->
  <path d="M 1160 360 Q 1200 360 1200 320 Q 1200 290 1160 305" stroke="#D97706" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <text x="1130" y="350" class="rel-label" fill="#D97706" font-size="10">parent</text>

  <!-- Legend -->
  <g transform="translate(40, 800)">
    <rect width="380" height="60" rx="8" fill="#fff" stroke="#E2E8F0"/>
    <text x="14" y="20" font-size="12" font-weight="600" fill="#1e293b">Legend</text>
    <text x="14" y="38" font-size="11" fill="#475569">— solid line: ON DELETE CASCADE</text>
    <text x="14" y="52" font-size="11" fill="#475569">- - dashed: ON DELETE CASCADE (linked via user)</text>
    <text x="200" y="38" font-size="11" fill="#475569">PK: primary key</text>
    <text x="200" y="52" font-size="11" fill="#475569">FK: foreign key</text>
  </g>
</svg>
